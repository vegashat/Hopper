services:
  hopperdb:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: hopperdb
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"

      DB_NAME: "Hopper"
      BAK_PATH: "/var/opt/sqlserver/backup/Hopper.bak"
      FORCE_RESTORE: "0"

    ports:
      - "1435:1433"
    volumes:
      - hopper_mssql_data:/var/opt/mssql
      - ./db/backup:/var/opt/sqlserver/backup
    restart: unless-stopped
    networks:
      - hoppernet

  hopper_api:
    build:
      context: ./Hopper.Api
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Server=hopperdb,1433;Database=Hopper;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True
    ports:
      - "5154:8080"
    depends_on:
      - hopperdb
    networks:
      - hoppernet

  hopper_client:
    build:
      context: ./Hopper.Client
      dockerfile: Dockerfile
    ports:
      - "4278:80"
    depends_on:
      - hopper_api
    networks:
      - hoppernet

networks:
  hoppernet:
    driver: bridge

volumes:
  hopper_mssql_data:
