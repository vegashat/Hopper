<mat-toolbar color="primary" class="header-toolbar">
  <!-- Menu -->
  <button mat-icon-button (click)="menuToggle.emit()" class="menu-btn">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- Title -->
  <span class="title">Hopper Draft</span>

  <!-- Spacer before draft status -->
  <span class="spacer"></span>

  <!-- Draft Status (centered) -->
  <div class="draft-status" *ngIf="currentPick || nextPick || lastPick">
    <span *ngIf="currentPick" class="status-item current">
      <mat-icon>person</mat-icon>
      Now: <strong>{{ currentPick }}</strong>
    </span>
    <span *ngIf="nextPick" class="status-item next">
      <mat-icon>schedule</mat-icon>
      Next: <strong>{{ nextPick }}</strong>
    </span>
    <span *ngIf="lastPick" class="status-item last">
      <mat-icon>history</mat-icon>
      Last: <strong>{{ lastPick }}</strong>
    </span>
  </div>

  <!-- Spacer after draft status -->
  <span class="spacer"></span>

  <!-- Auth -->
  <ng-container *ngIf="!(authService.currentUser$ | async); else loggedIn">
    <button mat-raised-button color="warn" class="login-btn" (click)="openLogin()">
      <mat-icon>login</mat-icon> Login
    </button>
  </ng-container>

  <ng-template #loggedIn>
    <span class="user-label">
      <mat-icon>verified_user</mat-icon>
      {{ authService.currentUser?.displayName }}
    </span>
    <button mat-button class="logout-btn" (click)="logout()">Logout</button>
  </ng-template>
</mat-toolbar>
