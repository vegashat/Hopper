<div class="filter-container">
    <h2 mat-dialog-title>Filter Games</h2>
    <mat-dialog-content>
        <h3>Months</h3>
        <mat-button-toggle-group multiple [(ngModel)]="selectedMonths" hideMultipleSelectionIndicator="true">
            <mat-button-toggle *ngFor="let m of months" [value]="m">{{ m }}</mat-button-toggle>
        </mat-button-toggle-group>

        <h3>Days of the Week</h3>
        <mat-button-toggle-group multiple [(ngModel)]="selectedDays" hideMultipleSelectionIndicator="true">
            <mat-button-toggle *ngFor="let d of days" [value]="d">{{ d }}</mat-button-toggle>
        </mat-button-toggle-group>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-button (click)="clearFilters()">Clear</button>
        <button mat-button mat-dialog-close>Cancel</button>
        <button mat-raised-button color="primary" (click)="apply()">Apply</button>
    </mat-dialog-actions>
</div>
