<div class="history-toolbar">
  <mat-slide-toggle [checked]="showMineOnly" (change)="onToggleMine($event.checked)" [disabled]="!currentUserId">
    Show only my picks
  </mat-slide-toggle>
</div>

<div *ngIf="loading" class="loading">
  <mat-spinner></mat-spinner>
</div>

<div *ngIf="!loading">
  <table mat-table [dataSource]="picks" class="mat-elevation-z1 full-width">

    <!-- Pick Order -->
    <ng-container matColumnDef="order">
      <th mat-header-cell *matHeaderCellDef> Pick # </th>
      <td mat-cell *matCellDef="let pick"> {{ pick.pickOrder }} </td>
    </ng-container>

    <!-- User -->
    <ng-container matColumnDef="user">
      <th mat-header-cell *matHeaderCellDef> User </th>
      <td mat-cell *matCellDef="let pick"> {{ pick.displayName || pick.firebaseUserId }}
        <i *ngIf="pick.firebaseUserId != pick.pickedById">(Picked by {{pick.pickedByDisplayName}})</i>
      </td>
    </ng-container>

    <!-- Team -->
    <ng-container matColumnDef="team">
      <th mat-header-cell *matHeaderCellDef> Team </th>
      <td mat-cell *matCellDef="let pick">
        <div class="team-cell">
          <img *ngIf="pick.team?.logoUrl" [src]="'assets/' + pick.team.logoUrl" [alt]="pick.team.name"
            class="team-logo" />
          <span>{{ pick.team?.name }}</span>
        </div>
      </td>
    </ng-container>

    <!-- Date -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> Date </th>
      <td mat-cell *matCellDef="let pick"> {{ pick.gameDateTime}} </td>
    </ng-container>

    <!-- Quantity -->
    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef> Tickets </th>
      <td mat-cell *matCellDef="let pick"> {{ pick.quantity }} </td>
    </ng-container>

    <!-- Table rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
