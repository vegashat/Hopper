<!-- src/app/pages/history.component.html -->
<div *ngIf="loading" class="loading">
  <mat-spinner></mat-spinner>
</div>

<div *ngIf="!loading">
  <table mat-table [dataSource]="picks" class="mat-elevation-z1 full-width">

    <!-- Order -->
    <ng-container matColumnDef="order">
      <th mat-header-cell *matHeaderCellDef> Pick # </th>
      <td mat-cell *matCellDef="let pick"> {{ pick.pickOrder }} </td>
    </ng-container>

    <!-- User -->
    <ng-container matColumnDef="user">
      <th mat-header-cell *matHeaderCellDef> User </th>
      <td mat-cell *matCellDef="let pick"> {{ pick.displayName || pick.firebaseUserId }} </td>
    </ng-container>

    <!-- Claimed -->
    <ng-container matColumnDef="claimedUtc">
      <th mat-header-cell *matHeaderCellDef> Claimed </th>
      <td mat-cell *matCellDef="let pick"> {{ pick.claimedUtc | date:'short' }} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
