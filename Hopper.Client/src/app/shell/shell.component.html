<mat-sidenav-container class="shell-container">
  <mat-sidenav #sidenav mode="over" class="sidenav">
    <mat-toolbar>Hopper Draft</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/games" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon>sports_basketball</mat-icon>
        <span class="link-label">Games</span>
      </a>
      <a mat-list-item routerLink="/calendar" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon>calendar_month</mat-icon>
        <span class="link-label">Calendar</span>
      </a>
      <a mat-list-item routerLink="/history" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon>history</mat-icon>
        <span class="link-label">History</span>
      </a>
      <a mat-list-item routerLink="/participants" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon>groups</mat-icon>
        <span class="link-label">Participants</span>
      </a>
      <a mat-list-item routerLink="/admin" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon>admin_panel_settings</mat-icon>
        <span class="link-label">Admin</span>
      </a>
      <a mat-list-item routerLink="/draft-status" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon>assignment</mat-icon>
        <span class="link-label">Draft Status</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="shell-layout">
      <!-- Header sticks at top -->
      <app-header (menuToggle)="sidenav.toggle()"></app-header>

      <!-- Scrollable content -->
      <div class="shell-content">
        <router-outlet></router-outlet>
      </div>

      <mat-toolbar color="accent" class="shell-footer games-toolbar">
        <!-- Left: Quick links -->
        <div class="toolbar-left">
          <button mat-icon-button routerLink="/games"><mat-icon>sports_basketball</mat-icon></button>
          <button mat-icon-button routerLink="/calendar"><mat-icon>calendar_month</mat-icon></button>
          <button mat-icon-button routerLink="/history"><mat-icon>history</mat-icon></button>
          <button mat-icon-button routerLink="/participants"><mat-icon>groups</mat-icon></button>
        </div>

        <!-- Center/Right: Search -->
        <div class="toolbar-center" [class.compact]="isCompact">
          <div class="search-box">
            <mat-icon>search</mat-icon>
            <input type="text" placeholder="Search games" [(ngModel)]="searchTerm"
              (ngModelChange)="onSearchChange($event)" />

            <!-- Filter stays inside box when cramped -->
            <button mat-icon-button (click)="openFilterDialog()" matTooltip="Filter" [matBadge]="filterCount()"
              matBadgeColor="warn" [matBadgeHidden]="filterCount() === 0">
              <mat-icon>filter_list</mat-icon>
            </button>

            <!-- Clear button only if typing -->
            <button *ngIf="searchTerm" mat-icon-button class="clear-btn" (click)="searchTerm=''; onSearchChange('')">
              <mat-icon>close</mat-icon>
            </button>
          </div>
        </div>

        <!-- Right: Toggle -->
        <div class="toolbar-right">
          <button mat-raised-button color="primary" (click)="toggleAvailable()">
            {{ showAvailableOnly ? 'Show All' : 'Show Available' }}
          </button>
        </div>
      </mat-toolbar>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
